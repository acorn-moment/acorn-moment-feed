name: Monitor fund announcements

on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check CMB public fund announcements
        run: python scripts/monitor_fund_announcements.py
      - name: Publish monitoring result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fund-limits.json
          git diff --cached --quiet || git commit -m "chore: refresh fund announcement monitor"
          git push
